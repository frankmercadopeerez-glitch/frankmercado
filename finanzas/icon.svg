<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1019"/>
      <stop offset="1" stop-color="#060910"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5BC45"/>
      <stop offset="1" stop-color="#E8A020"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Subtle gold radial glow -->
  <circle cx="256" cy="220" r="200" fill="#F5BC45" opacity="0.07"/>
  <!-- Rounded shield container, content within 80% safe zone -->
  <rect x="146" y="116" width="220" height="220" rx="56"
        fill="rgba(245,188,69,0.10)" stroke="url(#gold)" stroke-width="6"/>
  <!-- Gold "F" -->
  <text x="256" y="296" font-family="Georgia, 'Times New Roman', serif"
        font-size="170" font-weight="bold" fill="url(#gold)" text-anchor="middle">F</text>
</svg>
